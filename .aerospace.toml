# Keybinds mirror .config/niri/config.kdl with niri's Mod mapped to cmd.
# Binds that would shadow core macOS shortcuts (paste, find, close tab, zoom...) add ctrl.
# Docs: https://nikitabobko.github.io/AeroSpace/commands

config-version = 2
auto-reload-config = true

after-startup-command = [
    'exec-and-forget borders active_color=0xff1688f0 inactive_color=0xff494d64 width=6.0'
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 10
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse window-lazy-center'

automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[mode.main.binding]
cmd-q = 'close'
cmd-m = 'fullscreen --no-outer-gaps'

cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

cmd-ctrl-h = 'move left'
cmd-ctrl-j = 'move down'
cmd-ctrl-k = 'move up'
cmd-ctrl-l = 'move right'

cmd-shift-h = 'focus-monitor left'
cmd-shift-j = 'focus-monitor down'
cmd-shift-k = 'focus-monitor up'
cmd-shift-l = 'focus-monitor right'

cmd-ctrl-shift-h = 'move-node-to-monitor --focus-follows-window left'
cmd-ctrl-shift-j = 'move-node-to-monitor --focus-follows-window down'
cmd-ctrl-shift-k = 'move-node-to-monitor --focus-follows-window up'
cmd-ctrl-shift-l = 'move-node-to-monitor --focus-follows-window right'

cmd-u = 'workspace next'
cmd-i = 'workspace prev'
cmd-ctrl-u = 'move-node-to-workspace --focus-follows-window next'
cmd-ctrl-i = 'move-node-to-workspace --focus-follows-window prev'

cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

cmd-ctrl-1 = 'move-node-to-workspace --focus-follows-window 1'
cmd-ctrl-2 = 'move-node-to-workspace --focus-follows-window 2'
cmd-ctrl-3 = 'move-node-to-workspace --focus-follows-window 3'
cmd-ctrl-4 = 'move-node-to-workspace --focus-follows-window 4'
cmd-ctrl-5 = 'move-node-to-workspace --focus-follows-window 5'
cmd-ctrl-6 = 'move-node-to-workspace --focus-follows-window 6'
cmd-ctrl-7 = 'move-node-to-workspace --focus-follows-window 7'
cmd-ctrl-8 = 'move-node-to-workspace --focus-follows-window 8'
cmd-ctrl-9 = 'move-node-to-workspace --focus-follows-window 9'

cmd-ctrl-r = 'balance-sizes'

cmd-ctrl-t = "exec-and-forget osascript -e 'tell application \"iTerm\" to create window with default profile'"
cmd-ctrl-o = "exec-and-forget open -a 'Mission Control'"
cmd-ctrl-shift-p = 'exec-and-forget pmset displaysleepnow'

cmd-ctrl-f = 'fullscreen'
cmd-ctrl-shift-f = 'macos-native-fullscreen'
cmd-ctrl-v = 'layout floating tiling'
cmd-ctrl-w = 'layout accordion tiles'

cmd-ctrl-leftSquareBracket = 'join-with left'
cmd-ctrl-rightSquareBracket = 'join-with right'

cmd-ctrl-minus = 'resize width -100'
cmd-ctrl-equal = 'resize width +100'
cmd-ctrl-shift-minus = 'resize height -100'
cmd-ctrl-shift-equal = 'resize height +100'

cmd-shift-m = 'mode manage'

[mode.manage.binding]
esc = 'mode main'
enter = 'mode main'
c = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
slash = ['layout horizontal vertical', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'org.qutebrowser.qutebrowser'
run = 'layout tiling'

[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace 2'
